<header class="heading">
  <h1>Add Task</h1>
</header>
<section>
  <form class="task-form">
    <div class="task-form__columns">
      <div class="task-form__column task-form__column--left">
        <label class="task-form__label">
          Title
          <input class="task-form__input" type="text" placeholder="Enter a title" />
        </label>
        <label class="task-form__label">
          Description
          <textarea class="task-form__input" placeholder="Enter a description"></textarea>
        </label>
        <label class="task-form__label">
          Due date
          <input class="task-form__input" type="date" />
        </label>
      </div>

      <div class="task-form__divider"></div>

      <div class="task-form__column task-form__column--right">
        <label class="task-form__label">
          Category
          <input class="task-form__input" type="text" />
        </label>
        <label class="task-form__label">
          Subtasks
          <input class="task-form__input" type="text" placeholder="Add new subtask" />
        </label>
      </div>
    </div>

    <div class="task-form__actions">
      <p><span>*</span>This field is required</p>
      <div class="task-form__buttons">
        <app-button-primary typeStr="cancel" widthStr="7.875rem">Clear</app-button-primary>
        <app-button-primary typeStr="createTask" widthStr="13rem" buttonType="submit">Create task</app-button-primary>
      </div>
    </div>
  </form>
</section>
