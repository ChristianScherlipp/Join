<section class="login">
    <h1 class="login__title">Log in</h1>
    <form class="login__form" #loginForm="ngForm" (ngSubmit)="submit()" novalidate>
        <label class="login__field" [class.login__field--error]="fieldError.isVisible('email')">
            <input class="login__input" type="email" name="email" placeholder="Email" aria-label="Email"
                autocomplete="email" [(ngModel)]="form.email" (blur)="fieldError.check('email', form.email)">
            <img class="input-icon" src="assets/icons/mail.svg" alt="Email Icon">
            @if (fieldError.isVisible('email')) {
            <span class="login__field-error" role="alert">{{ fieldError.message('email') }}</span>
            }
        </label>
        <label class="login__field" [class.login__field--error]="fieldError.isVisible('loginPassword')">
            <input class="login__input" [type]="passwordVisible() ? 'text' : 'password'" name="password"
                placeholder="Password" aria-label="Password" autocomplete="current-password" [(ngModel)]="form.password"
                (blur)="fieldError.check('loginPassword', form.password)" />

            @if (form.password.length > 0) {
            <button class="password-toggle" type="button" [attr.aria-label]="
      passwordVisible() ? 'Passwort verbergen' : 'Passwort anzeigen'
    " [attr.aria-pressed]="passwordVisible()" (click)="togglePasswordVisibility()">
                <img [src]="passwordVisible()
        ? 'assets/icons/visibility.svg'
        : 'assets/icons/visibility_off.svg'" alt="" />
            </button>
            } @else {
            <img class="input-icon" src="assets/icons/lock.svg" alt="" />
            }
            @if (fieldError.isVisible('loginPassword')) {
            <span class="login__field-error" role="alert">{{ fieldError.message('loginPassword') }}</span>
            }
        </label>
        @if (errorMessage()) {
        <p class="login__error" role="alert">{{ errorMessage() }}</p>
        }
        <div class="login__actions">
            <app-button-primary typeStr="dark" widthStr="5.5rem" buttonType="submit"
                [isDisabled]="saving() || !form.email.trim() || !form.password">Log
                in</app-button-primary>
            <app-button-primary typeStr="light" widthStr="8.75rem" buttonType="button" [isDisabled]="saving()"
                (click)="guestLogin()">Guest Log in</app-button-primary>
        </div>
    </form>
</section>
