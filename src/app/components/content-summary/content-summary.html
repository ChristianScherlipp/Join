<section class="summary">
    <header class="summary__head">
        <h1 class="summary__title">Join 360</h1>
        <span class="summary__divider"></span>
        <p class="summary__subtitle">Key Metrics at a Glance</p>
    </header>

    <div class="summary__content">
        <div class="summary__grid">
            <a class="summary__card summary__card--half" routerLink="/board">
                <span class="summary__icon summary__icon--todo"></span>
                <div class="summary__count">
                    <span class="summary__number">1</span>
                    <span class="summary__label">To-do</span>
                </div>
            </a>
            <a class="summary__card summary__card--half" routerLink="/board">
                <span class="summary__icon summary__icon--done"></span>
                <div class="summary__count">
                    <span class="summary__number">1</span>
                    <span class="summary__label">Done</span>
                </div>
            </a>
            <a class="summary__card summary__card--wide" routerLink="/board">
                <span class="summary__icon summary__icon--urgent"></span>
                <div class="summary__count">
                    <span class="summary__number">1</span>
                    <span class="summary__prio-label">Urgent</span>
                </div>

                <span class="summary__card-divider"></span>

                <div class="summary__deadline">
                    <span class="summary__date">November 24, 2026</span>
                    <span class="summary__deadline-label">Upcoming Deadline</span>
                </div>
            </a>
            <a class="summary__card summary__card--third" routerLink="/board">
                <span class="summary__number">5</span>
                <span class="summary__label">Tasks in Board</span>
            </a>

            <a class="summary__card summary__card--third" routerLink="/board">
                <span class="summary__number">2</span>
                <span class="summary__label">Tasks in Progress</span>
            </a>

            <a class="summary__card summary__card--third" routerLink="/board">
                <span class="summary__number">2</span>
                <span class="summary__label">Awaiting Feedback</span>
            </a>
        </div>
        <p class="summary__greeting">Good morning!</p>
    </div>
</section>
