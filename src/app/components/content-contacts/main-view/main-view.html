<header class="heading">
  <h1>Contacts</h1>
  <span class="divider" aria-hidden="true"></span>
  <p>Better with a team</p>
</header>

<!-- Zeigt die Karte nur an, wenn ein Kontakt ausgewählt wurde. -->
@if (contact(); as selected) {
<section class="contact-card" aria-label="Kontaktdetails">
  <header class="card-header">
    <app-initial-icon [name]="selected.name" [withShadow]="true"
      class="contact-icon"></app-initial-icon>

    <div class="contact-details">
      <h2>{{ selected.name }}</h2>
      <nav class="edit-contact">
        <button type="button" class="button-edit-and-delete for-display" (click)="editRequested.emit()">
          <img src="./assets/icons/edit.svg" alt="pen">Edit
        </button>
        <button type="button" class="button-edit-and-delete for-display" (click)="deleteRequested.emit()">
          <img src="./assets/icons/delete.svg" alt="trash">Delete
        </button>
      </nav>
    </div>
  </header>

  <h3>Contact Information</h3>

  <dl>
    <dt>Email</dt>

    <dd>
      <a [href]="'mailto:' + selected.email">
        {{ selected.email }}
      </a>
    </dd>

    <dt>Phone</dt>

    <dd>
      @if (selected.phone) {
      <a class="phone" [href]="'tel:' + selected.phone">
        {{ selected.phone }}
      </a>
      } @else {
      Keine Telefonnummer hinterlegt
      }
    </dd>
  </dl>
  <details class="mobile-actions" #actionMenu>
    <summary aria-label="Kontaktaktionen öffnen oder schließen">
      <span aria-hidden="true">⋮</span>
    </summary>

    <menu>
      <li>
        <button type="button" (click)="actionMenu.open = false; editRequested.emit()">
          <img src="./assets/icons/edit.svg" alt="" />
          <span>Edit</span>
        </button>
      </li>

      <li>
        <button type="button" (click)="actionMenu.open = false; deleteRequested.emit()">
          <img src="./assets/icons/delete.svg" alt="" />
          <span>Delete</span>
        </button>
      </li>
    </menu>
  </details>
</section>
}
