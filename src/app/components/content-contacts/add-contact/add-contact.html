<!-- Der native Dialog übernimmt Fokus und Hintergrundsperre. -->
<dialog
  #dialog
  aria-labelledby="dialog-title"
  (cancel)="onCancel($event)"
  (close)="isOpen.set(false)"
>
  <div class="dialog-layout">
    <header class="intro">
      <img
        class="logo"
        src="/assets/icons/join-logo-white.svg"
        alt="JOIN"
      />

      <h2 id="dialog-title">Add contact</h2>
      <p>Tasks are better with a team!</p>

      <span class="intro-line" aria-hidden="true"></span>
    </header>

    <div class="content">
      <button
        class="close-button"
        type="button"
        aria-label="Dialog schließen"
        [disabled]="contactService.saving()"
        (click)="close()"
      >
        ×
      </button>

      <!-- Zeigt entweder Initialen oder das Personensymbol. -->
      <span
        class="avatar"
        [style.background-color]="
          newContact.name.trim() ? avatarColor : '#d1d1d1'
        "
        aria-hidden="true"
      >
        @if (newContact.name.trim()) {
          {{ avatar.getInitials(newContact.name) }}
        } @else {
          <img src="/assets/icons/person.svg" alt="" />
        }
      </span>

      <form #contactForm="ngForm" (ngSubmit)="save()">
        <label class="input-wrapper" for="contact-name">
          <span class="visually-hidden">Name</span>

          <input
            id="contact-name"
            name="name"
            type="text"
            placeholder="Name"
            autocomplete="name"
            [(ngModel)]="newContact.name"
            required
          />

          <img src="/assets/icons/person.svg" alt="" />
        </label>

        <label class="input-wrapper" for="contact-email">
          <span class="visually-hidden">E-Mail</span>

          <input
            id="contact-email"
            name="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
            [(ngModel)]="newContact.email"
            required
            email
          />

          <img src="/assets/icons/mail.svg" alt="" />
        </label>

        <label class="input-wrapper" for="contact-phone">
          <span class="visually-hidden">Telefon (optional)</span>

          <input
            id="contact-phone"
            name="phone"
            type="tel"
            placeholder="Phone"
            autocomplete="tel"
            [(ngModel)]="newContact.phone"
          />

          <img src="/assets/icons/call.svg" alt="" />
        </label>

        @if (contactService.errorMessage()) {
          <p class="error-message" role="alert">
            {{ contactService.errorMessage() }}
          </p>
        }

        <footer class="actions">
          <button
            class="secondary-button"
            type="button"
            [disabled]="contactService.saving()"
            (click)="close()"
          >
            Cancel ×
          </button>

          <button
            class="primary-button"
            type="submit"
            [disabled]="
              contactForm.invalid ||
              !newContact.name.trim() ||
              contactService.saving()
            "
          >
            @if (contactService.saving()) {
              Saving …
            } @else {
              Create contact ✓
            }
          </button>
        </footer>
      </form>
    </div>
  </div>
</dialog>
