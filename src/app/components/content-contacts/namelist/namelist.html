<aside class="sidebar" aria-label="Kontaktliste">
  <div class="toolbar">
    <button
      class="add-button"
      type="button"
      (click)="addRequested.emit()"
    >
      Add new contact
      <img src="/assets/icons/person_add.svg" alt="" />
    </button>
  </div>

  <div class="list-scroll">
    @if (loading()) {
      <p role="status">Kontakte werden geladen …</p>
    } @else {
      @for (group of groups(); track group.letter) {
        <section>
          <h2>{{ group.letter }}</h2>

          <ul>
            @for (contact of group.contacts; track contact.id) {
              <li>
                <button
                  class="contact-row"
                  type="button"
                  [class.selected]="selectedId() === contact.id"
                  [attr.aria-pressed]="selectedId() === contact.id"
                  (click)="contactSelected.emit(contact)"
                >
                  <span
                    class="avatar"
                    [style.background-color]="getColor(contact.name)"
                    aria-hidden="true"
                  >
                    {{ getInitials(contact.name) }}
                  </span>

                  <span class="contact-text">
                    <span class="name">{{ contact.name }}</span>
                    <span class="email">{{ contact.email }}</span>
                  </span>
                </button>
              </li>
            }
          </ul>
        </section>
      } @empty {
        <p>Noch keine Kontakte vorhanden.</p>
      }
    }
  </div>
</aside>
