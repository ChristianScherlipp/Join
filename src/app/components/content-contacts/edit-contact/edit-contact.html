<dialog class="edit-area" #dialog (cancel)="onCancel($event)" (close)="fieldError.reset()">
    <section class="edit-area__left">
        <img class="edit-area__logo" src="./assets/icons/join-logo-white.svg" alt="Join logo" />
        <h2 class="edit-area__title">Edit contact
            <div class="edit-area__line"></div>
        </h2>
    </section>
    <section class="edit-area__right">
        <button class="edit-area__close" type="button" (click)="close()" aria-label="Close">
            <img src="./assets/icons/cancel.svg" alt="Icon Close" />
        </button>
        <app-initial-icon class="edit-area__avatar" [name]="previewName()" [withShadow]="true" />
        <form class="edit-area__form" #editForm="ngForm" (ngSubmit)="saveContact()">
            <div class="edit-area__group">
                <label class="edit-area__field" [class.edit-area__field--error]="fieldError.isVisible('name')">
                    <input (blur)="fieldError.check('name', formData.name); updatePreview(formData.name)" class="edit-area__input" type="text" name="name" placeholder="Name" [(ngModel)]="formData.name" required />
                    <img src="./assets/icons/person.svg" alt="" />
                </label>
                @if (fieldError.isVisible('name')) {
                    <span class="edit-area__field-error" role="alert">{{ fieldError.message('name') }}</span>
                }
            </div>
            <div class="edit-area__group">
                <label class="edit-area__field" [class.edit-area__field--error]="fieldError.isVisible('email')">
                    <input (blur)="fieldError.check('email', formData.email)" class="edit-area__input" type="email" name="email" placeholder="Email" [(ngModel)]="formData.email" required />
                    <img src="./assets/icons/mail.svg" alt="" />
                </label>
                @if (fieldError.isVisible('email')) {
                    <span class="edit-area__field-error" role="alert">{{ fieldError.message('email') }}</span>
                }
            </div>
            <div class="edit-area__group">
                <label class="edit-area__field" [class.edit-area__field--error]="fieldError.isVisible('phone')">
                    <input (blur)="fieldError.check('phone', formData.phone)" class="edit-area__input" type="tel" name="phone" placeholder="Phone" [(ngModel)]="formData.phone" />
                    <img src="./assets/icons/call.svg" alt="" />
                </label>
                @if (fieldError.isVisible('phone')) {
                    <span class="edit-area__field-error" role="alert">{{ fieldError.message('phone') }}</span>
                }
            </div>
            <div class="edit-area__actions">
                <app-button-primary typeStr="light" (click)="deleteContact()">Delete</app-button-primary>
                <app-button-primary typeStr="createTask" buttonType="submit">Save</app-button-primary>
            </div>
        </form>
    </section>
</dialog>
