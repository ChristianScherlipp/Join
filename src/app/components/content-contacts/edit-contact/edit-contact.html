<dialog class="edit-area" open>
    <section class="edit-area__left">
        <img class="edit-area__logo" src="./assets/icons/join-logo-white.svg" alt="Join logo" />
        <h2 class="edit-area__title">Edit contact
            <div class="edit-area__line"></div>
        </h2>
    </section>
    <section class="edit-area__right">
        <button class="edit-area__close" type="button" aria-label="Close">
        <img src="./assets/icons/cancel.svg" alt="Icon Close" />
        </button>
        <div class="edit-area__avatar">AM</div>
        <form class="edit-area__form">
            <label class="edit-area__field">
                <input class="edit-area__input" type="text" name="name" placeholder="Name" />
                <img src="./assets/icons/person.svg" alt="" />
            </label>
            <label class="edit-area__field">
                <input class="edit-area__input" type="email" name="email" placeholder="Email" />
                <img src="./assets/icons/mail.svg" alt="" />
            </label>
            <label class="edit-area__field">
                <input class="edit-area__input" type="tel" name="phone" placeholder="Phone" />
                <img src="./assets/icons/call.svg" alt="" />
            </label>
            <div class="edit-area__actions">
                <app-button-primary typeStr="light" widthStr="7rem">Delete</app-button-primary>
                <app-button-primary typeStr="createTask" widthStr="7rem" buttonType="submit">Save</app-button-primary>
            </div>
        </form>
    </section>
</dialog>
