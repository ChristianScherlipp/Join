<!-- Verbindet Kontaktliste, Kontaktkarte und Dialog. -->
<section class="contacts-layout" aria-label="Kontakte">
  <app-namelist
    [contacts]="contactService.sortedUsers()"
    [loading]="contactService.loading()"
    [selectedId]="contactService.selectedContact()?.id ?? null"
    (contactSelected)="contactService.selectedContact.set($event)"
    (addRequested)="addDialog.open()"
  />

  <main class="main-panel">
    <app-main-view [contact]="contactService.selectedContact()" />

    <button (click)="deleteSelected()" [disabled]="!contactService.selectedContact()">
      Delete
    </button>

    @if (contactService.errorMessage() && !addDialog.isOpen()) {
      <p class="error-message" role="alert">
        {{ contactService.errorMessage() }}
      </p>
    }
  </main>
</section>

<app-add-contact #addDialog />
